{# Look of the galleries (menu Gallery, subproject files): cards, toolbar, viewer. Same presentation as the DCC web galleries. #}
<style>
    .gallery-scope { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: #fff; border: 1px solid #e5e9ee; border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(16, 24, 40, .05); }
    .gallery-scope__icon { width: 46px; height: 46px; border-radius: 12px; background: #e3eefb; color: #1a4f99; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .gallery-scope__kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #5f6b76; font-weight: 700; }
    .gallery-scope__name { font-size: 18px; font-weight: 700; color: #212529; }
    .gallery-sources { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .gallery-sources a { border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 13px; border: 1px solid #d6e4f5; color: #1a4f99; background: #fff; text-decoration: none; }
    .gallery-sources a.active, .gallery-sources a:hover { background: #1f6fd1; border-color: #1f6fd1; color: #fff; }
    .gallery-toolbar { gap: 12px; row-gap: 8px; }
    .gallery-toolbar .btn-group .btn { border-radius: 999px !important; padding: 4px 14px; font-size: 13px; font-weight: 500; }
    .gallery-toolbar .btn-group .btn + .btn { margin-left: 6px; }
    .gallery-toolbar .btn-group .btn.active { background-color: #599cf7; border-color: #599cf7; color: #fff; }
    .gallery-toolbar .active-chips { row-gap: 6px; }
    .gallery-toolbar .active-chips .badge { font-size: 12px; font-weight: 500; background-color: #eef4fb; color: #234; border: 1px solid #d6e4f5; }
    .gallery-toolbar .active-chips .badge a { text-decoration: none; color: inherit; font-weight: 600; }
    .gallery-toolbar .active-chips .badge a.chip-remove:hover { color: #d9534f; }
    .gallery-summary { font-size: 13px; color: #5f6b7a; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .gallery-grid + .gallery-grid { margin-top: 16px; }
    .gallery-card { position: relative; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #fff; transition: transform .15s ease, box-shadow .15s ease; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
    .gallery-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, .12); }
    .gallery-card__thumb { position: relative; aspect-ratio: 4 / 3; background: #f6f9fb; cursor: pointer; overflow: hidden; }
    .gallery-card__media, .gallery-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-card__doc { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; padding: 16px; text-align: center; background: linear-gradient(180deg, #ffffff 0%, #f1f5fa 100%); }
    .gallery-card__doc .ext { font-size: 11px; text-transform: uppercase; color: #6c757d; letter-spacing: .05em; font-weight: 600; }
    .gallery-card__missing { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 16px; text-align: center; background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 8px, #f1f3f6 8px, #f1f3f6 16px); color: #8a96a6; }
    .gallery-card__missing i { font-size: 32px; color: #c5cdd8; }
    .gallery-card__missing .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .gallery-card__overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; background: linear-gradient(to top, rgba(0, 0, 0, .75) 0%, rgba(0, 0, 0, 0) 100%); color: #fff; opacity: 0; transition: opacity .15s ease; font-size: 12px; line-height: 1.3; }
    .gallery-card:hover .gallery-card__overlay { opacity: 1; }
    .gallery-card__badge { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; }
    .gallery-card__body { padding: 8px 10px 10px; font-size: 12px; }
    .gallery-card__title { font-weight: 600; color: #234; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
    .gallery-card__location { color: #6c757d; margin-top: 2px; }
    .doc-card-actions { display: flex; gap: 14px; margin-top: 8px; }
    .doc-card-actions a { color: #6c757d; }
    .doc-card-actions a:hover { color: #333; }
    .gallery-empty { text-align: center; padding: 60px 20px; color: #6c757d; }
    .gallery-empty i { font-size: 48px; margin-bottom: 12px; opacity: .5; display: block; }
    .gallery-sentinel { height: 1px; }
    .gallery-loading { display: none; align-items: center; justify-content: center; gap: 10px; padding: 18px; color: #6c757d; }
    .gallery-loading.htmx-request { display: flex; }
    .gallery-error { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 16px; margin-top: 12px; border: 1px solid #dc3545; border-radius: 8px; background: #fdecea; color: #dc3545; }
    .gallery-error[hidden] { display: none; }
    #attachmentModal .modal-header, #attachmentFilterModal .modal-header { border: 0; }
    #attachmentModal .modal-dialog { max-width: 1100px; }
    #attachmentModal .modal-content { border-radius: 12px; overflow: hidden; }
    #attachmentModal .modal-header { padding: 8px 16px 0; align-items: center; }
    #attachmentModal .lightbox-counter { font-size: 13px; color: #6c757d; }
    #attachmentModal .modal-body { padding: 8px 20px 20px; }
    #attachmentModal .lightbox-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 16px; margin-bottom: 12px; background: #f6f9fb; border-radius: 8px; }
    #attachmentModal .lightbox-header__location { display: inline-flex; align-items: center; gap: 6px; color: #1a5fb4; font-weight: 600; font-size: 14px; text-decoration: none; }
    #attachmentModal .lightbox-header__task { font-size: 13px; text-align: right; color: #5f6b7a; }
    #attachmentModal .lightbox-stage { position: relative; padding: 0 44px; }
    #attachmentModal .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); border: 0; border-radius: 50%; background-color: #599cf7; color: #fff; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: .9; z-index: 1; }
    #attachmentModal .lightbox-nav:disabled { opacity: .3; cursor: default; }
    #attachmentModal .lightbox-prev { left: 0; } #attachmentModal .lightbox-next { right: 0; }
    #attachmentModal .lightbox-photo { min-height: 40vh; display: flex; align-items: center; justify-content: center; background: #0e1217; border-radius: 8px; padding: 12px; }
    #attachmentModal .lightbox-photo img { max-height: 65vh; max-width: 100%; width: auto; object-fit: contain; border-radius: 4px; }
    #attachmentModal .lightbox-frame { width: 100%; height: 70vh; border: 0; border-radius: 8px; background: #fff; }
    #attachmentModal .lightbox-doc { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; min-height: 40vh; text-align: center; color: #455a73; }
    #attachmentModal .lightbox-missing__panel { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40vh; width: 100%; color: #8a96a6; background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 8px, #f1f3f6 8px, #f1f3f6 16px); border-radius: 8px; padding: 30px; }
    #attachmentModal .lightbox-footer { display: flex; justify-content: center; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid #eef1f4; flex-wrap: wrap; gap: 8px; }
    #attachmentFilterModal .modal-dialog { max-width: 760px; }
    #attachmentFilterModal .form-group label { font-size: 13px; font-weight: 600; color: #455a73; }
</style>
