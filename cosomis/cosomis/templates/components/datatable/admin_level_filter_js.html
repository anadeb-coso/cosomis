{% comment %}
Cascading Region > Prefecture > Commune > Canton > Village selects of
admin_level_filter_card.html (needs js/cascade_requests.js).
{% endcomment %}
<script type="text/javascript">
    $(document).ready(function () {
        let cascaded = false;
        let id_prefecture = $('#id_prefecture');
        let id_commune = $('#id_commune');
        let id_canton = $('#id_canton');
        let id_village = $('#id_village');
        $('.administrative-level-filter select').on('change', function () {
            if (cascaded) return;
            cascaded = true;

            let administrative_level_id = null;
            let administrative_level_type = null;
            if ($(this).attr('id')) {
                administrative_level_id = $(this).val();
                administrative_level_id = administrative_level_id && administrative_level_id.length != 0 ? administrative_level_id : null;
                administrative_level_type = administrative_level_id ? $(this).attr('id').split('_')[1] : null;
            }

            $(".administrative-level-filter select").attr('disabled', true);
            $.ajax({
                type: 'GET',
                url: "{% url 'administrativelevels:utils:get_choices_for_next_administrative_level_all' %}",
                data: {
                    parent_id: $("#id_" + administrative_level_type).val()
                },
                success: function (data) {
                    if (!administrative_level_type || administrative_level_type == "region" || $("#id_" + administrative_level_type).val().length == 0) {
                        set_datas_administrative_level(id_prefecture, data.prefectures);
                        set_datas_administrative_level(id_commune, data.communes);
                        set_datas_administrative_level(id_canton, data.cantons);
                        set_datas_administrative_level(id_village, data.villages);
                    } else if (administrative_level_type == "prefecture") {
                        set_datas_administrative_level(id_commune, data.communes);
                        set_datas_administrative_level(id_canton, data.cantons);
                        set_datas_administrative_level(id_village, data.villages);
                    } else if (administrative_level_type == "commune") {
                        set_datas_administrative_level(id_canton, data.cantons);
                        set_datas_administrative_level(id_village, data.villages);
                    } else if (administrative_level_type == "canton") {
                        set_datas_administrative_level(id_village, data.villages);
                    }
                    cascaded = false;
                },
                error: function (data) {
                    alert(error_server_message + "Error " + data.status);
                    $(".administrative-level-filter select").attr('disabled', false);
                    cascaded = false;
                }
            }).done(function () {
                $(".administrative-level-filter select").attr('disabled', false);
                cascaded = false;
            });
        });
    });
</script>
