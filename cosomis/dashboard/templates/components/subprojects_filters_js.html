{% load i18n %}
{% comment %}
Script of components/subprojects_filters.html: subprojectsFilters() gives the
filters to send with the requests of the dashboard tabs (the same parameters
as the summary dashboard, read by dashboard.functions.filter_dashboard_subprojects).
{% endcomment %}
<script type="text/javascript">
    function subprojectsFilters() {
        return {
            id_subproject_sectors: $('#id_subproject_sectors').val(),
            id_subproject_types: $('#id_subproject_types').val(),
            id_works_type_of_subproject: $('#id_works_type_of_subproject').val(),
            id_subproject_step: $('#id_subproject_step').val(),
            id_components: $('#id_components').val(),
            start_date: $('#id_start_date').val(),
            end_date: $('#id_end_date').val(),
            all_projects: $('#id_include_all_projects').prop('checked') ? {{ PROJECTS_IDS|default:"[]" }} : null
        };
    }

    $(document).ready(function () {
        let dp1 = '<div class="input-group-prepend" data-target="#{id}" data-toggle="datetimepicker">' +
            '<div class="input-group-text"><i class="fa fa-calendar text-primary"></i></div></div>';
        let dp2 = '<div class="input-group date" id="{id}" data-target-input="nearest"></div>';
        $('#id_start_date').before(dp1.replace('{id}', 'start_date')).parent().wrapInner(
            dp2.replace('{id}', 'start_date'));
        $('#id_end_date').before(dp1.replace('{id}', 'end_date')).parent().wrapInner(
            dp2.replace('{id}', 'end_date'));

        //Datemask dd/mm/yyyy
        $('.datetimepicker-input').inputmask({alias: "datetime", inputFormat: "dd/mm/yyyy"});

        let options = {
            maxDate: Date.now(),
            useCurrent: false,
            format: "DD/MM/YYYY",
            widgetPositioning: {
                vertical: 'bottom',
            }
        };
        $('#start_date').datetimepicker(options);
        $('#end_date').datetimepicker(options);
    });
</script>
